<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- N letter with neon glow -->
  <text x="50" y="72" font-family="Arial Black, sans-serif" font-size="68" font-weight="900"
        text-anchor="middle" fill="url(#neon)" filter="url(#glow)">N</text>
  <!-- Sparkles -->
  <circle cx="20" cy="22" r="2" fill="#a855f7" opacity="0.8"/>
  <circle cx="80" cy="18" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="75" cy="78" r="1.8" fill="#a855f7" opacity="0.7"/>
  <circle cx="15" cy="75" r="1.2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="88" cy="50" r="1" fill="#a855f7" opacity="0.6"/>
</svg>